<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="style.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Image Slider</title>
</head>
<body>
    <div class="slider">
        <div class="slider-track">
            <div class="slide"><img src="image 1.jpg" alt="Slide 1"></div>
            <div class="slide"><img src="image 2.jpg" alt="Slide 2"></div>
            <div class="slide"><img src="image 3.jpg" alt="Slide 3"></div>
            <div class="slide"><img src="image 4.jpg" alt="Slide 4"></div>
            <div class="slide"><img src="image 5.jpg" alt="Slide 5"></div>
        </div>
        <button class="slider-btn prev">&#10094;</button>
        <button class="slider-btn next">&#10095;</button>
        
        <div class="slider-dots"></div>
    </div>
</body>
</html>
